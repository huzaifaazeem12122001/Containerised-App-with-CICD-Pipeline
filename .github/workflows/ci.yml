name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Nginx Web Image (Test)
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: my-nginx:test

    - name: Build API Image (Test)
      uses: docker/build-push-action@v5
      with:
        context: ./app
        push: false
        tags: node-api:test
